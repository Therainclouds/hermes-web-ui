name: Knowledge plugin — sqlite-vec smoke test

on:
  push:
    branches:
      - main
    paths:
      - 'packages/server/src/db/knowledge-schema.ts'
      - 'packages/server/src/services/knowledge/**'
      - 'tests/release/sqlite-vec-smoke.test.ts'
      - 'tests/server/knowledge-*.test.ts'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches:
      - main
      - base
    paths:
      - 'packages/server/src/db/knowledge-schema.ts'
      - 'packages/server/src/services/knowledge/**'
      - 'tests/release/sqlite-vec-smoke.test.ts'
      - 'tests/server/knowledge-*.test.ts'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: knowledge-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: sqlite-vec smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run knowledge plugin tests
        run: npx vitest run tests/server/knowledge- tests/release/sqlite-vec-smoke.test.ts
