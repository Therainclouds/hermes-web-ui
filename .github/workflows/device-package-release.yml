name: device-package-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish (e.g. v0.6.14)
        required: true
        type: string
      channel:
        description: Release channel to update
        required: false
        default: stable
        type: string
      min_current_version:
        description: Minimum current version allowed to upgrade from
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: device-package-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      RELEASE_CHANNEL: ${{ github.event.inputs.channel || '' }}
      MIN_CURRENT_VERSION: ${{ github.event.inputs.min_current_version || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify release consistency
        run: npm run check:release-consistency

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run device-package focused validation
        run: npm run test:device-package-release

      - name: Build project
        run: npm run build

      - name: Build device package release
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --tag "${RELEASE_TAG}"
            --release-repo "${GITHUB_REPOSITORY}"
            --release-config ".github/device-package-release.json"
          )
          if [ -n "${RELEASE_CHANNEL}" ]; then
            args+=(--channel "${RELEASE_CHANNEL}")
          fi
          if [ -n "${MIN_CURRENT_VERSION}" ]; then
            args+=(--min-current-version "${MIN_CURRENT_VERSION}")
          fi
          npm run build:device-package -- "${args[@]}"

      - name: Read release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs')
          const metadata = JSON.parse(fs.readFileSync('dist/device-package-release/release-metadata.json', 'utf8'))
          console.log(`artifact_path=${metadata.artifactPath}`)
          console.log(`sha_path=${metadata.shaPath}`)
          console.log(`manifest_path=${metadata.manifestPath}`)
          console.log(`latest_path=${metadata.latestPath}`)
          console.log(`tag=${metadata.tag}`)
          console.log(`channel=${metadata.channel}`)
          console.log(`manifest_branch=${metadata.manifestBranch}`)
          console.log(`manifest_base_url=${metadata.manifestBaseUrl}`)
          console.log(`latest_url=${metadata.latestUrl}`)
          console.log(`oss_path=${metadata.ossPath || ''}`)
          console.log(`oss_public_base_url=${metadata.ossPublicBaseUrl || ''}`)
          console.log(`oss_artifact_path=${metadata.ossArtifactPath || ''}`)
          console.log(`oss_sha_path=${metadata.ossShaPath || ''}`)
          console.log(`oss_manifest_path=${metadata.ossManifestPath || ''}`)
          console.log(`oss_latest_path=${metadata.ossLatestPath || ''}`)
          console.log(`oss_artifact_url=${metadata.ossArtifactUrl || ''}`)
          console.log(`oss_manifest_url=${metadata.ossManifestUrl || ''}`)
          console.log(`oss_latest_url=${metadata.ossLatestUrl || ''}`)
          console.log(`source_artifact_path=${metadata.sourceArtifactPath || ''}`)
          console.log(`source_sha_path=${metadata.sourceShaPath || ''}`)
          console.log(`source_artifact_name=${metadata.sourceArtifactName || ''}`)
          console.log(`oss_source_artifact_path=${metadata.ossSourceArtifactPath || ''}`)
          console.log(`oss_source_sha_path=${metadata.ossSourceShaPath || ''}`)
          console.log(`oss_source_url=${metadata.ossSourceUrl || ''}`)
          console.log(`oss_source_sha_url=${metadata.ossSourceShaUrl || ''}`)
          console.log(`github_source_url=${metadata.githubSourceUrl || ''}`)
          NODE

      - name: Read Hermes Agent stable config
        id: hermes_agent
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs')
          const config = JSON.parse(fs.readFileSync('release/hermes-agent-stable.json', 'utf8'))

          const version = String(config.version || '').trim()
          const wheelUrl = String(config.wheel_url || '').trim()
          const channel = String(config.channel || 'stable').trim()

          if (!version) {
            throw new Error('release/hermes-agent-stable.json version is required')
          }
          if (!wheelUrl) {
            throw new Error('release/hermes-agent-stable.json wheel_url is required')
          }
          if (!/^[A-Za-z0-9._-]+$/.test(channel)) {
            throw new Error(`Invalid Hermes Agent channel: ${channel}`)
          }

          console.log(`version=${version}`)
          console.log(`wheel_url=${wheelUrl}`)
          console.log(`channel=${channel}`)
          NODE

      - name: Ensure GitHub release exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --verify-tag --title "${RELEASE_TAG}" --notes "Automated device package release assets."
          fi

      - name: Upload device package assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(
            "${{ steps.metadata.outputs.artifact_path }}"
            "${{ steps.metadata.outputs.sha_path }}"
            "${{ steps.metadata.outputs.manifest_path }}"
          )
          if [ -n "${{ steps.metadata.outputs.source_artifact_path }}" ]; then
            args+=(
              "${{ steps.metadata.outputs.source_artifact_path }}"
              "${{ steps.metadata.outputs.source_sha_path }}"
            )
          fi
          gh release upload "${RELEASE_TAG}" \
            "${args[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

      - name: Setup OSS util
        if: steps.metadata.outputs.oss_path != ''
        uses: yizhoumo/setup-ossutil@v2

      - name: Setup Python
        if: steps.metadata.outputs.oss_path != ''
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Configure OSS credentials
        if: steps.metadata.outputs.oss_path != ''
        shell: bash
        env:
          ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          : "${ALIYUN_OSS_ENDPOINT:?ALIYUN_OSS_ENDPOINT is required}"
          : "${ALIYUN_OSS_ACCESS_KEY_ID:?ALIYUN_OSS_ACCESS_KEY_ID is required}"
          : "${ALIYUN_OSS_ACCESS_KEY_SECRET:?ALIYUN_OSS_ACCESS_KEY_SECRET is required}"

          endpoint="${ALIYUN_OSS_ENDPOINT}"
          if [[ "${endpoint}" != http://* && "${endpoint}" != https://* ]]; then
            endpoint="https://${endpoint}"
          fi

          cat > "${HOME}/.ossutilconfig" <<EOF
          [Credentials]
          language = EN
          endpoint = ${endpoint}
          accessKeyID = ${ALIYUN_OSS_ACCESS_KEY_ID}
          accessKeySecret = ${ALIYUN_OSS_ACCESS_KEY_SECRET}
          EOF
          chmod 600 "${HOME}/.ossutilconfig"

      - name: Verify OSS configuration
        if: steps.metadata.outputs.oss_path != ''
        shell: bash
        run: |
          set -euo pipefail
          test -f "${HOME}/.ossutilconfig"
          grep -q '^endpoint = ' "${HOME}/.ossutilconfig"
          ossutil -c "${HOME}/.ossutilconfig" ls "${{ steps.metadata.outputs.oss_path }}" >/dev/null

      - name: Upload release assets to OSS
        if: steps.metadata.outputs.oss_path != ''
        shell: bash
        run: |
          set -euo pipefail
          ossutil -c "${HOME}/.ossutilconfig" cp -f "${{ steps.metadata.outputs.artifact_path }}" "${{ steps.metadata.outputs.oss_artifact_path }}"
          ossutil -c "${HOME}/.ossutilconfig" cp -f "${{ steps.metadata.outputs.sha_path }}" "${{ steps.metadata.outputs.oss_sha_path }}"
          ossutil -c "${HOME}/.ossutilconfig" cp -f "${{ steps.metadata.outputs.manifest_path }}" "${{ steps.metadata.outputs.oss_manifest_path }}"
          ossutil -c "${HOME}/.ossutilconfig" cp -f "${{ steps.metadata.outputs.latest_path }}" "${{ steps.metadata.outputs.oss_latest_path }}"
          if [ -n "${{ steps.metadata.outputs.source_artifact_path }}" ]; then
            ossutil -c "${HOME}/.ossutilconfig" cp -f "${{ steps.metadata.outputs.source_artifact_path }}" "${{ steps.metadata.outputs.oss_source_artifact_path }}"
            ossutil -c "${HOME}/.ossutilconfig" cp -f "${{ steps.metadata.outputs.source_sha_path }}" "${{ steps.metadata.outputs.oss_source_sha_path }}"
          fi

      - name: Mirror Hermes Agent stable release to OSS
        if: steps.metadata.outputs.oss_path != ''
        shell: bash
        env:
          AGENT_VERSION: ${{ steps.hermes_agent.outputs.version }}
          WHEEL_URL: ${{ steps.hermes_agent.outputs.wheel_url }}
          AGENT_CHANNEL: ${{ steps.hermes_agent.outputs.channel }}
          OSS_PATH: ${{ steps.metadata.outputs.oss_path }}
          OSS_PUBLIC_BASE_URL: ${{ steps.metadata.outputs.oss_public_base_url }}
        run: |
          set -euo pipefail

          mkdir -p dist/hermes-agent/release dist/hermes-agent/wheelhouse dist/hermes-agent/metadata
          python -m pip install --upgrade pip
          python -m pip download --dest dist/hermes-agent/release "${WHEEL_URL}"

          wheel_path="$(find dist/hermes-agent/release -maxdepth 1 -type f -name '*.whl' | head -n 1)"
          if [ -z "${wheel_path}" ]; then
            echo "Failed to download hermes-agent wheel from ${WHEEL_URL}" >&2
            exit 1
          fi

          python -m pip download --dest dist/hermes-agent/wheelhouse "${wheel_path}"
          cp -f "${wheel_path}" dist/hermes-agent/wheelhouse/

          wheel_name="$(basename "${wheel_path}")"
          export RELEASE_URL="${OSS_PUBLIC_BASE_URL}/hermes-agent/releases/${AGENT_VERSION}/${wheel_name}"
          export WHEELHOUSE_URL="${OSS_PUBLIC_BASE_URL}/hermes-agent/wheelhouse/"

          python <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path

          payload = {
              "version": os.environ["AGENT_VERSION"].strip(),
              "wheelUrl": os.environ["RELEASE_URL"].strip(),
              "wheelUrls": [
                  os.environ["RELEASE_URL"].strip(),
                  os.environ["WHEEL_URL"].strip(),
              ],
              "wheelhouseUrl": os.environ["WHEELHOUSE_URL"].strip(),
              "releasedAt": datetime.utcnow().replace(microsecond=0).isoformat() + "Z",
          }
          metadata_dir = Path("dist/hermes-agent/metadata")
          metadata_dir.mkdir(parents=True, exist_ok=True)
          (metadata_dir / "latest.json").write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

          ossutil -c "${HOME}/.ossutilconfig" cp -f "${wheel_path}" "${OSS_PATH}/hermes-agent/releases/${AGENT_VERSION}/${wheel_name}"
          ossutil -c "${HOME}/.ossutilconfig" cp -r -f dist/hermes-agent/wheelhouse/ "${OSS_PATH}/hermes-agent/wheelhouse/"
          ossutil -c "${HOME}/.ossutilconfig" cp -f dist/hermes-agent/metadata/latest.json "${OSS_PATH}/hermes-agent/${AGENT_CHANNEL}/latest.json"

      - name: Publish latest.json on manifest branch
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ steps.metadata.outputs.channel }}
          MANIFEST_BRANCH: ${{ steps.metadata.outputs.manifest_branch }}
          LATEST_PATH: ${{ steps.metadata.outputs.latest_path }}
          MANIFEST_PATH: ${{ steps.metadata.outputs.manifest_path }}
          SHA_PATH: ${{ steps.metadata.outputs.sha_path }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "${MANIFEST_BRANCH}" >/dev/null 2>&1; then
            git fetch origin "${MANIFEST_BRANCH}:${MANIFEST_BRANCH}"
            git worktree add .manifest-branch "${MANIFEST_BRANCH}"
          else
            git worktree add --detach .manifest-branch
            (
              cd .manifest-branch
              git checkout --orphan "${MANIFEST_BRANCH}"
              git rm -rf . >/dev/null 2>&1 || true
            )
          fi

          mkdir -p ".manifest-branch/releases/${RELEASE_CHANNEL}" ".manifest-branch/releases/${RELEASE_TAG}"
          cp "${LATEST_PATH}" ".manifest-branch/releases/${RELEASE_CHANNEL}/latest.json"
          cp "${MANIFEST_PATH}" ".manifest-branch/releases/${RELEASE_TAG}/manifest.json"
          cp "${SHA_PATH}" ".manifest-branch/releases/${RELEASE_TAG}/$(basename "${SHA_PATH}")"

          (
            cd .manifest-branch
            git add releases
            git commit -m "chore: publish ${RELEASE_TAG} device package metadata" || true
            git push origin "${MANIFEST_BRANCH}"
          )

      - name: Verify published assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin "${{ steps.metadata.outputs.manifest_branch }}"
          git show "origin/${{ steps.metadata.outputs.manifest_branch }}:releases/${{ steps.metadata.outputs.channel }}/latest.json" > /tmp/latest.json
          diff -u "${{ steps.metadata.outputs.latest_path }}" /tmp/latest.json

          manifest_asset_url="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[] | select(.name == "manifest.json") | .apiUrl')"
          if [ -z "${manifest_asset_url}" ]; then
            echo "manifest.json asset is missing on release ${RELEASE_TAG}" >&2
            exit 1
          fi
          curl -fsSL \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "${manifest_asset_url}" > /tmp/manifest.json
          diff -u "${{ steps.metadata.outputs.manifest_path }}" /tmp/manifest.json

          package_url="$(node -e "const fs=require('node:fs'); const data=JSON.parse(fs.readFileSync('${{ steps.metadata.outputs.latest_path }}','utf8')); process.stdout.write(data.packageUrl)")"
          expected_sha="$(node -e "const fs=require('node:fs'); const data=JSON.parse(fs.readFileSync('${{ steps.metadata.outputs.latest_path }}','utf8')); process.stdout.write(data.sha256)")"
          curl -fsSL "${package_url}" > /tmp/device-package.tar.gz
          actual_sha="$(sha256sum /tmp/device-package.tar.gz | awk '{print $1}')"
          if [ "${actual_sha}" != "${expected_sha}" ]; then
            echo "Published device package checksum mismatch: expected ${expected_sha}, got ${actual_sha}" >&2
            exit 1
          fi

          if [ -n "${{ steps.metadata.outputs.oss_latest_url }}" ]; then
            curl -fsSL "${{ steps.metadata.outputs.oss_latest_url }}" > /tmp/oss-latest.json
            diff -u "${{ steps.metadata.outputs.latest_path }}" /tmp/oss-latest.json
          fi

          if [ -n "${{ steps.metadata.outputs.oss_manifest_url }}" ]; then
            curl -fsSL "${{ steps.metadata.outputs.oss_manifest_url }}" > /tmp/oss-manifest.json
            diff -u "${{ steps.metadata.outputs.manifest_path }}" /tmp/oss-manifest.json
          fi

          if [ -n "${{ steps.metadata.outputs.oss_artifact_url }}" ]; then
            curl -fsSL "${{ steps.metadata.outputs.oss_artifact_url }}" > /tmp/oss-device-package.tar.gz
            oss_actual_sha="$(sha256sum /tmp/oss-device-package.tar.gz | awk '{print $1}')"
            if [ "${oss_actual_sha}" != "${expected_sha}" ]; then
              echo "OSS device package checksum mismatch: expected ${expected_sha}, got ${oss_actual_sha}" >&2
              exit 1
            fi
          fi

          source_url="$(node -e "const fs=require('node:fs'); const data=JSON.parse(fs.readFileSync('${{ steps.metadata.outputs.latest_path }}','utf8')); process.stdout.write(String(data.sourceUrls?.[0] || data.sourceUrl || ''))")"
          source_expected_sha="$(node -e "const fs=require('node:fs'); const data=JSON.parse(fs.readFileSync('${{ steps.metadata.outputs.latest_path }}','utf8')); process.stdout.write(String(data.sourceSha256 || ''))")"
          if [ -n "${source_url}" ]; then
            curl -fsSL "${source_url}" > /tmp/source-package.tar.gz
            if [ -n "${source_expected_sha}" ]; then
              source_actual_sha="$(sha256sum /tmp/source-package.tar.gz | awk '{print $1}')"
              if [ "${source_actual_sha}" != "${source_expected_sha}" ]; then
                echo "Source package checksum mismatch for ${source_url}: expected ${source_expected_sha}, got ${source_actual_sha}" >&2
                exit 1
              fi
            fi
          fi

          hermes_agent_channel="${{ steps.hermes_agent.outputs.channel }}"
          hermes_agent_version="${{ steps.hermes_agent.outputs.version }}"
          hermes_agent_latest_url="${{ steps.metadata.outputs.oss_public_base_url }}/hermes-agent/${hermes_agent_channel}/latest.json"
          curl -fsSL "${hermes_agent_latest_url}" > /tmp/hermes-agent-latest.json
          grep -F "\"version\": \"${hermes_agent_version}\"" /tmp/hermes-agent-latest.json

          hermes_agent_wheel_url="$(node -e "const fs=require('node:fs'); const data=JSON.parse(fs.readFileSync('/tmp/hermes-agent-latest.json','utf8')); process.stdout.write(String(data.wheelUrl || ''))")"
          if [ -z "${hermes_agent_wheel_url}" ]; then
            echo "Published Hermes Agent metadata is missing wheelUrl" >&2
            exit 1
          fi
          curl -fsSL "${hermes_agent_wheel_url}" -o /tmp/hermes-agent.whl

      - name: Upload release metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: device-package-release-${{ steps.metadata.outputs.tag }}
          path: |
            dist/device-package-release/release-metadata.json
            ${{ steps.metadata.outputs.manifest_path }}
            ${{ steps.metadata.outputs.latest_path }}
            ${{ steps.metadata.outputs.sha_path }}
            ${{ steps.metadata.outputs.source_artifact_path }}
            ${{ steps.metadata.outputs.source_sha_path }}

      - name: Write workflow summary
        shell: bash
        run: |
          {
            echo "## Device Package Release"
            echo
            echo "- Tag: \`${RELEASE_TAG}\`"
            echo "- Channel: \`${{ steps.metadata.outputs.channel }}\`"
            echo "- Manifest branch: \`${{ steps.metadata.outputs.manifest_branch }}\`"
            echo "- Manifest base URL: \`${{ steps.metadata.outputs.manifest_base_url }}\`"
            echo "- Latest URL: [latest.json](${{ steps.metadata.outputs.latest_url }})"
            if [ -n "${{ steps.metadata.outputs.oss_source_url }}" ]; then
              echo "- OSS source URL: \`${{ steps.metadata.outputs.oss_source_url }}\`"
            fi
            if [ -n "${{ steps.metadata.outputs.github_source_url }}" ]; then
              echo "- GitHub source URL: \`${{ steps.metadata.outputs.github_source_url }}\`"
            fi
            echo "- Hermes Agent stable: \`${{ steps.hermes_agent.outputs.version }}\`"
            echo "- Hermes Agent channel: \`${{ steps.hermes_agent.outputs.channel }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
