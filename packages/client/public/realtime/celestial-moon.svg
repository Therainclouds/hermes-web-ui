<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <!--
    Omni-Realtime 暗主题天体：月亮。
    画布 480×480，月面圆盘圆心 (240,240) 半径 150——OmniVisualizer 以
    discR/150 为缩放比 drawImage 进 canvas，圆盘外的 86px 环带是柔光
    光晕的呼吸余量。左上受光，右下 terminator 渐暗；月海 + 五座环形山
    用"暗底 + 左上偏移亮缘"两层椭圆叠出立体感。
  -->
  <defs>
    <radialGradient id="moon-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.52" stop-color="#dfe4ff" stop-opacity="0.16"/>
      <stop offset="0.66" stop-color="#dfe4ff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#dfe4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon-body" cx="0.37" cy="0.34" r="0.98">
      <stop offset="0" stop-color="#fcfbf7"/>
      <stop offset="0.42" stop-color="#ece8de"/>
      <stop offset="0.74" stop-color="#ccc7ba"/>
      <stop offset="0.94" stop-color="#a29d90"/>
      <stop offset="1" stop-color="#8b8679"/>
    </radialGradient>
    <linearGradient id="moon-terminator" x1="0.18" y1="0.14" x2="0.88" y2="0.95">
      <stop offset="0.45" stop-color="#3c3a34" stop-opacity="0"/>
      <stop offset="1" stop-color="#3c3a34" stop-opacity="0.38"/>
    </linearGradient>
    <radialGradient id="moon-bloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 外圈柔光 -->
  <circle cx="240" cy="240" r="236" fill="url(#moon-glow)"/>

  <!-- 月盘 -->
  <circle cx="240" cy="240" r="150" fill="url(#moon-body)"/>

  <!-- 月海（大面积暗斑） -->
  <ellipse cx="200" cy="196" rx="54" ry="42" fill="#a49f92" opacity="0.30"/>
  <ellipse cx="238" cy="230" rx="34" ry="26" fill="#a49f92" opacity="0.22"/>
  <ellipse cx="286" cy="278" rx="52" ry="40" fill="#9d9889" opacity="0.26"/>
  <ellipse cx="188" cy="282" rx="30" ry="22" fill="#a49f92" opacity="0.24"/>

  <!-- 环形山：暗底 + 左上偏移亮缘 -->
  <g>
    <ellipse cx="286" cy="196" rx="19" ry="18" fill="#8d887b" opacity="0.42"/>
    <ellipse cx="284" cy="193.6" rx="17" ry="16" fill="#d9d5c9" opacity="0.38"/>
    <ellipse cx="287" cy="197" rx="13" ry="12" fill="#948f82" opacity="0.40"/>

    <ellipse cx="216" cy="248" rx="13" ry="12" fill="#8d887b" opacity="0.42"/>
    <ellipse cx="214.6" cy="246.4" rx="11.5" ry="10.5" fill="#d9d5c9" opacity="0.38"/>
    <ellipse cx="217" cy="249" rx="9" ry="8" fill="#948f82" opacity="0.40"/>

    <ellipse cx="256" cy="308" rx="10" ry="9" fill="#8d887b" opacity="0.40"/>
    <ellipse cx="255" cy="306.6" rx="8.8" ry="7.9" fill="#d9d5c9" opacity="0.36"/>
    <ellipse cx="257" cy="309" rx="6.6" ry="6" fill="#948f82" opacity="0.38"/>

    <ellipse cx="164" cy="238" rx="9" ry="8" fill="#8d887b" opacity="0.38"/>
    <ellipse cx="163.2" cy="236.8" rx="7.8" ry="7" fill="#d9d5c9" opacity="0.34"/>
    <ellipse cx="165" cy="239" rx="5.8" ry="5.2" fill="#948f82" opacity="0.36"/>

    <ellipse cx="312" cy="252" rx="7" ry="6.4" fill="#8d887b" opacity="0.36"/>
    <ellipse cx="311.4" cy="251" rx="6" ry="5.5" fill="#d9d5c9" opacity="0.32"/>
    <ellipse cx="313" cy="253" rx="4.4" ry="4" fill="#948f82" opacity="0.34"/>
  </g>

  <!-- 右下 terminator 渐暗 -->
  <circle cx="240" cy="240" r="150" fill="url(#moon-terminator)"/>

  <!-- 左上受光面柔光 -->
  <ellipse cx="188" cy="180" rx="96" ry="84" fill="url(#moon-bloom)" opacity="0.5"/>
</svg>
